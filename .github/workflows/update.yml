name: dataset-refresh

# 数据集分发架构 v2（2026-10-31 定稿，kiss docs/routing-program.md §9）：
# 上游 dat（raw 唯一源）→ zrs-convert 容器 + ads 轻量覆盖 → zip →
# GitHub Release 资产（git 历史零增长）→ version.json v2 入仓（唯一 commit）。
# B2 无人值守运营随本工作流销案；jsDelivr/purge 全族退役。

on:
  schedule:
    - cron: "23 18 * * *" # 每日 18:23 UTC（上游 release dat 日更后）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 直接装官方 tarball（setup-zig action 尚不识别 0.16 正式版的新命名
      # zig-<arch>-<os>-<ver>，实测 404；官方 index.json 实锚本 URL）
      - name: Install zig 0.16.0
        run: |
          curl -sSfL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      # geo-zrs 自包含（zrs 格式+转换工具同仓；公开仓零跨仓凭据——依赖方向
      # 反转：zigroute(私有) → geozrs(公开)，2026-10-31 用户裁定）
      - name: Refresh datasets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./update.sh --publish
